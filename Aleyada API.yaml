          description: ''
    put:
      operationId: doctor_clinics_working_hours_update
      description: |-
        **Required before any slot can be generated.** These hours are the envelope every doctor's availability is clipped to.

        Replaces the whole week at once. Split shifts are simply two entries for the same weekday.

        Slots are regenerated for every doctor at the clinic. Existing appointments are never cancelled: any that now fall outside the new hours come back in `needs_reschedule` for a human to deal with.
