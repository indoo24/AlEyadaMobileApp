      parameters:
      - in: query
        name: area
        schema:
          type: string
        description: Area slug
      - in: query
        name: booking_enabled
        schema:
          type: boolean
      - in: query
        name: city
        schema:
          type: string
        description: City slug
      - in: query
        name: clinic
        schema:
          type: string
        description: Clinic slug
      - in: query
        name: featured
        schema:
          type: boolean
      - in: query
        name: gender
        schema:
          type: string
      - in: query
        name: lat
        schema:
          type: number
          format: double
        description: Latitude, required when sort=nearest.
      - in: query
        name: lng
        schema:
          type: number
          format: double
        description: Longitude, required when sort=nearest.
      - in: query
        name: max_fee
        schema:
          type: number
      - in: query
        name: min_experience
        schema:
          type: integer
      - in: query
        name: min_rating
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
