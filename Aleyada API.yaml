      description: |-
        Shared guard rails for flipping `is_active`.

        - The super admin is untouchable (deactivating it is how you lock yourself
          out of your own system).
        - Nobody deactivates themselves — that is a resignation letter, not an API
          call.
        - A plain admin cannot touch staff accounts at all; they are not even in
          their visible set, so the scoped fetch 404s before any rule fires.
      summary: Reactivate
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
