openapi: 3.0.3
info:
  title: Aleyada API
  version: 1.0.0
  description: Aleyada medical directory backend. All business logic lives server-side;
    clients (web + Flutter) render returned state only.
paths:
  /api/v1/admin/admins/:
    post:
      operationId: admin_admins_create
      description: The ONLY way an admin account comes into existence. Creating a
        second super admin is impossible on any code path — the model manager and
        a partial unique index both refuse.
      summary: Create an admin (super admin only)
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCreateAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCreateAdminRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/articles/:
    get:
      operationId: admin_articles_list
      description: '`?status=published` is the live feed an admin certifies from.'
      summary: All articles
      parameters:
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - draft
          - pending_review
          - published
        description: |-
          * `draft` - Draft
          * `pending_review` - Pending review
          * `published` - Published
          * `archived` - Archived
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminArticleList'
          description: ''
  /api/v1/admin/articles/{id}/certify/:
    post:
      operationId: admin_articles_certify_create
      summary: Certify an article (site medical stamp)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
          description: ''
  /api/v1/admin/articles/{id}/publish/:
    post:
      operationId: admin_articles_publish_create
      summary: Publish an article
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
          description: ''
  /api/v1/admin/articles/{id}/reject/:
    post:
      operationId: admin_articles_reject_create
      summary: Send an article back to its author
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
          description: ''
  /api/v1/admin/articles/{id}/uncertify/:
    post:
      operationId: admin_articles_uncertify_create
      summary: Withdraw an article's certification
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
          description: ''
  /api/v1/admin/articles/{id}/unpublish/:
    post:
      operationId: admin_articles_unpublish_create
      summary: Retire a live article
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
          description: ''
  /api/v1/admin/assistants/:
    get:
      operationId: admin_assistants_list
      summary: All assistants
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssistantProfileList'
          description: ''
  /api/v1/admin/assistants/{id}/deactivate/:
    post:
      operationId: admin_assistants_deactivate_create
      description: One switch cuts every assignment at once — the employee left.
      summary: Deactivate an assistant
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssistantProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssistantProfileRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantProfile'
          description: ''
  /api/v1/admin/assistants/create/:
    post:
      operationId: admin_assistants_create_create
      summary: Create an assistant for any doctor
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAssistantCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAssistantCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAssistantCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantProfile'
          description: ''
  /api/v1/admin/claim-requests/:
    get:
      operationId: admin_claim_requests_list
      summary: Profile claim queue (oldest first)
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - needs_more_info
          - pending
          - rejected
        description: |-
          * `pending` - Pending
          * `approved` - Approved
          * `rejected` - Rejected
          * `needs_more_info` - Needs more info
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminClaimRequestList'
          description: ''
  /api/v1/admin/claim-requests/{id}/:
    get:
      operationId: admin_claim_requests_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClaimRequest'
          description: ''
  /api/v1/admin/claim-requests/{id}/approve/:
    post:
      operationId: admin_claim_requests_approve_create
      description: Atomically discards the claimant's own draft profile, attaches
        them to the imported one, and auto-rejects every competing claim on it. This
        is what keeps the WordPress import from producing duplicate doctors.
      summary: 'Approve a claim: link the doctor to the imported profile'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_DecisionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_Decision'
          description: ''
  /api/v1/admin/claim-requests/{id}/needs-info/:
    post:
      operationId: admin_claim_requests_needs_info_create
      summary: Ask the claimant for more proof
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_NeedsInfoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_NeedsInfoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_NeedsInfoRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_NeedsInfo'
          description: ''
  /api/v1/admin/claim-requests/{id}/reject/:
    post:
      operationId: admin_claim_requests_reject_create
      summary: Reject a claim
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_DecisionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_Decision'
          description: ''
  /api/v1/admin/clinics/:
    get:
      operationId: admin_clinics_list
      description: '`is_active=false` is the queue of doctor-created clinics awaiting
        a check.'
      summary: All clinics
      parameters:
      - in: query
        name: area
        schema:
          type: string
          format: uuid
      - in: query
        name: city
        schema:
          type: string
          format: uuid
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminClinicList'
          description: ''
  /api/v1/admin/clinics/{id}/activate/:
    post:
      operationId: admin_clinics_activate_create
      description: Deactivating hides the clinic and stops new slots being generated.
        Existing appointments are left alone — cancelling a patient's visit is not
        a side effect of an admin flipping a switch.
      summary: Activate / deactivate a clinic
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClinic'
          description: ''
  /api/v1/admin/clinics/{id}/link-doctor/:
    post:
      operationId: admin_clinics_link_doctor_create
      description: Admin-only on purpose. A doctor may create their own clinic, but
        attaching themselves to one somebody else created would let anyone list themselves
        at a well-known hospital and borrow its reputation.
      summary: Attach a doctor to an existing clinic
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkDoctorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkDoctorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkDoctorRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicDetail'
          description: ''
  /api/v1/admin/clinics/create/:
    post:
      operationId: admin_clinics_create_create
      summary: Create a clinic (live immediately)
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClinicWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClinicWriteRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClinic'
          description: ''
  /api/v1/admin/doctors/:
    get:
      operationId: admin_doctors_list
      summary: All doctors, including unpublished
      parameters:
      - in: query
        name: is_featured
        schema:
          type: boolean
      - in: query
        name: is_published
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: verification_status
        schema:
          type: string
          enum:
          - approved
          - draft
          - pending_review
          - rejected
        description: |-
          * `draft` - Draft
          * `pending_review` - Pending review
          * `approved` - Approved
          * `rejected` - Rejected
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoctorOwnProfileList'
          description: ''
  /api/v1/admin/doctors/create/:
    post:
      operationId: admin_doctors_create_create
      description: Creates the login and an APPROVED profile in one step — the admin
        performing this is the verifier. The doctor still has to add clinics, opening
        hours and availability before anything is bookable; that critical path is
        unchanged.
      summary: Create a doctor directly (manual onboarding)
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateDoctorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCreateDoctorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCreateDoctorRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/outbox/:
    get:
      operationId: admin_outbox_list
      description: Every message the system tried to send, and what became of it.
        Filter by `status=cancelled` with `cancel_reason=no_consent` to see what an
        opt-out suppressed.
      summary: The outbox
      parameters:
      - in: query
        name: booking
        schema:
          type: string
          format: uuid
      - in: query
        name: cancel_reason
        schema:
          type: string
          enum:
          - booking_cancelled
          - booking_rescheduled
          - no_consent
          - no_destination
          - no_provider
          - superseded
        description: |-
          * `no_consent` - The recipient has not opted in
          * `booking_cancelled` - The appointment was cancelled
          * `booking_rescheduled` - The appointment moved
          * `superseded` - Replaced by a newer message
          * `no_destination` - No phone number or email to send to
          * `no_provider` - No provider is configured for this channel
      - in: query
        name: channel
        schema:
          type: string
          enum:
          - email
          - push
          - sms
          - whatsapp
        description: |-
          * `sms` - SMS
          * `whatsapp` - WhatsApp
          * `email` - بريد إلكتروني
          * `push` - Push notification
      - in: query
        name: event
        schema:
          type: string
          enum:
          - booking_cancelled
          - booking_cancelled_staff
          - booking_completed
          - booking_confirmed
          - booking_confirmed_staff
          - booking_no_show
          - booking_pending
          - booking_reminder
          - booking_rescheduled
          - claim_result
          - clinic_invitation_accepted
          - clinic_invitation_declined
          - clinic_invitation_received
          - doctor_verified
          - duration_decided
          - duration_verification_requested
          - feedback_request
          - payment_proof_reviewed
          - payment_proof_uploaded
          - review_approved
          - review_clarification_answered
          - review_clarification_requested
          - review_rejected
        description: |-
          * `booking_confirmed` - Booking confirmed
          * `booking_pending` - Booking awaiting verification
          * `booking_cancelled` - Booking cancelled
          * `booking_confirmed_staff` - New confirmed booking (staff)
          * `booking_cancelled_staff` - Booking cancelled (staff)
          * `booking_rescheduled` - Booking rescheduled
          * `booking_reminder` - Appointment reminder
          * `booking_completed` - Visit completed
          * `booking_no_show` - Marked as no-show
          * `duration_verification_requested` - Duration verification requested
          * `duration_decided` - Duration decided by the doctor
          * `payment_proof_uploaded` - Payment proof uploaded
          * `payment_proof_reviewed` - Payment proof reviewed
          * `doctor_verified` - Doctor verification result
          * `claim_result` - Profile claim result
          * `clinic_invitation_received` - Invited to join a clinic
          * `clinic_invitation_accepted` - Clinic invitation accepted
          * `clinic_invitation_declined` - Clinic invitation declined
          * `review_approved` - Review published
          * `review_rejected` - Review rejected
          * `review_clarification_requested` - Doctor asked about your review
          * `review_clarification_answered` - Patient replied to your question
          * `feedback_request` - Rate your visit
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - failed
          - pending
          - sent
        description: |-
          * `pending` - Pending
          * `sent` - Sent
          * `failed` - Failed
          * `cancelled` - Cancelled
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOutboundMessageList'
          description: ''
  /api/v1/admin/reports/doctors/:
    get:
      operationId: admin_reports_doctors_list
      description: Which doctors are converting, which are not. Reads the rollup.
      summary: Directory-wide report
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorStats'
          description: ''
  /api/v1/admin/reports/doctors/{id}/:
    get:
      operationId: admin_reports_doctors_retrieve
      summary: Any doctor's stats
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorStats'
          description: ''
  /api/v1/admin/reports/rebuild/:
    post:
      operationId: admin_reports_rebuild_create
      description: Idempotent — it recomputes from the raw events rather than incrementing,
        so re-running it produces the same numbers, not doubled ones. Use it to backfill,
        or after fixing a bug in the aggregation.
      summary: Rebuild the rollup for a date
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildStatsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RebuildStatsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RebuildStatsRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildResult'
          description: ''
  /api/v1/admin/reviews/:
    get:
      operationId: admin_reviews_list
      summary: Review moderation queue (oldest first)
      parameters:
      - in: query
        name: moderation_status
        schema:
          type: string
          enum:
          - approved
          - pending
          - rejected
        description: |-
          * `pending` - Pending moderation
          * `approved` - Approved
          * `rejected` - Rejected
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: rating
        schema:
          type: integer
      - in: query
        name: target_type
        schema:
          type: string
          enum:
          - clinic
          - doctor
        description: |-
          * `doctor` - Doctor
          * `clinic` - Clinic
      - in: query
        name: verified_visit
        schema:
          type: boolean
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminReviewList'
          description: ''
  /api/v1/admin/reviews/{id}/moderate/:
    post:
      operationId: admin_reviews_moderate_create
      description: Every decision recomputes the target's cached rating from the source
        rows — approving, rejecting *and* unpublishing. A rejected review that was
        previously approved gives its stars back.
      summary: Moderate a review
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationDecisionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReview'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: Every account of every type, filterable by role and searchable
        by name / phone / email. Admin and super-admin rows are visible to the super
        admin only.
      summary: Browse user accounts
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
