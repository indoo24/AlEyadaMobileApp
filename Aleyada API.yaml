    PasswordForgot:
      type: object
      properties:
        phone:
          type: string
      required:
      - phone
    PasswordForgotRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
      required:
      - phone
    PasswordReset:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
          maxLength: 10
          minLength: 4
      required:
      - code
      - phone
    PasswordResetRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 4
          maxLength: 10
        new_password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
      required:
      - code
      - new_password
      - phone
    PatchedArticleWriteRequest:
      type: object
      description: |-
        Create/edit payload. `reviewed_by_doctor` and `publish` are intents the
        service adjudicates by role — the serializer only shapes the input.
      properties:
        title_ar:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          format: uuid
        excerpt:
          type: string
          description: Auto-derived from the body if left empty.
        content:
          type: string
          minLength: 1
          description: Rich HTML. Sanitised on save.
        featured_image:
          type: string
          format: binary
          nullable: true
        seo_title:
          type: string
          maxLength: 70
        seo_description:
          type: string
          maxLength: 160
        reviewed_by_doctor:
          type: string
          format: uuid
          nullable: true
        publish:
          type: boolean
          default: false
    PatchedAssignmentWriteRequest:
      type: object
      properties:
        clinic:
          type: string
          format: uuid
          nullable: true
        flags:
          $ref: '#/components/schemas/FlagsRequest'
    PatchedAvailabilityExceptionRequest:
      type: object
      properties:
        clinic:
          type: string
          format: uuid
        date:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/AvailabilityExceptionTypeEnum'
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
        reason:
          type: string
          maxLength: 200
    PatchedAvailabilityWindowRequest:
      type: object
      properties:
        clinic:
          type: string
          format: uuid
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          minimum: 0
          maximum: 32767
        start_time:
          type: string
          format: time
          description: Clinic-local time.
        end_time:
          type: string
          format: time
        default_duration_minutes:
          type: integer
          maximum: 240
          minimum: 5
        first_visit_duration_minutes:
          type: integer
          maximum: 240
          minimum: 5
        followup_duration_minutes:
          type: integer
          maximum: 240
          minimum: 5
        slot_step_minutes:
          type: integer
          maximum: 240
          minimum: 5
          description: Grid step. Usually equal to the default duration.
        valid_from:
          type: string
          format: date
          nullable: true
        valid_to:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
    PatchedClinicWriteRequest:
      type: object
      properties:
        name_ar:
          type: string
          minLength: 1
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        city:
          type: string
          format: uuid
          nullable: true
        area:
          type: string
          format: uuid
          nullable: true
        address_ar:
          type: string
        landmark:
          type: string
          maxLength: 200
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        google_maps_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 20
        whatsapp:
          type: string
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 300
          - type: string
            maxLength: 0
        timezone:
          type: string
          minLength: 1
          description: Working hours are expressed in this zone; slots are stored
            in UTC.
          maxLength: 50
    PatchedDoctorCertificateWriteRequest:
      type: object
      description: |-
        `is_public` is read-only: whether a credential appears on the public
        profile is an admin's call, not the doctor's.
      properties:
        title_ar:
          type: string
          minLength: 1
          maxLength: 200
        title_en:
          type: string
          maxLength: 200
        file:
          type: string
          format: binary
          writeOnly: true
        issuer:
          type: string
          maxLength: 200
        year:
          type: integer
          maximum: 2100
          minimum: 1900
          nullable: true
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
    PatchedDoctorClinicWriteRequest:
      type: object
      description: |-
        My terms at this clinic. Always mine to change, even when the clinic
        itself belongs to someone else.
      properties:
        consultation_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        followup_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        booking_enabled:
          type: boolean
          description: 'False = contact-only: show phone/WhatsApp buttons, hide slots.'
        payment_required:
          type: boolean
          description: Patients upload external payment proof; no gateway in v1.
        is_primary:
          type: boolean
        is_active:
          type: boolean
    PatchedDoctorEducationWriteRequest:
      type: object
      properties:
        degree_ar:
          type: string
          minLength: 1
          maxLength: 200
        degree_en:
          type: string
          maxLength: 200
        institution_ar:
          type: string
          minLength: 1
          maxLength: 200
        institution_en:
          type: string
          maxLength: 200
        year:
          type: integer
          maximum: 2100
          minimum: 1900
          nullable: true
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
    PatchedDoctorProfileUpdateRequest:
