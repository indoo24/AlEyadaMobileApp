          type: object
          additionalProperties: {}
          description: |-
            Where an aspiring doctor's request stands — application or claim.

            Separate from `doctor_profile` on purpose. An applicant holds a draft
            profile from the moment they submit, so the profile's presence cannot
            tell the client whether to say "we received your application" or "your
            ownership claim is under review"; only the request rows can. Costs two
            indexed lookups, which is the price of not guessing at someone's status.
