  /api/v1/doctors/{slug}/availability/:
    get:
      operationId: doctors_availability_list
      description: |-
        Only times the patient can actually take: the doctor works then, the clinic is open then, **and the doctor is not booked then at any other clinic**. Slots are grouped into the clinic's own calendar days and labelled in its timezone — the client does no date arithmetic.

        A contact-only doctor returns their phone and WhatsApp instead of slots.
      summary: Available appointment slots
      parameters:
      - in: query
        name: clinic_id
        schema:
          type: string
        description: Required when the doctor has several.
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: At most 31 days.
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - doctors
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityDay'
          description: ''
  /api/v1/doctors/{slug}/book/:
    post:
      operationId: doctors_book_create
      description: |-
        **Confirmed immediately.** The slot was free and the patient took it; there is no pending hold and no clinic approval step. The clinic can still cancel afterwards, and the patient is told why.

