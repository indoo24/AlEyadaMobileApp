    RoleRefreshingTokenRefresh:
      type: object
      description: |-
        Refresh, and bring the `role` claim back in step with the database.

        The problem it solves: a doctor applies, is approved, and their account is
        promoted from patient to doctor — but the session they are already holding
        was minted before that. simplejwt copies custom claims forward on rotation,
        so `role` stays frozen at whatever it was when they logged in, for as long
        as they keep refreshing. Up to seven days of landing on the patient
        homepage, cured only by logging out and back in. Approval should not come
        with homework.

        Why re-stamping here is the safe place to do it:

        * **Nothing is trusted that was not already verified.** The incoming token
          is parsed and verified first — signature, expiry, blacklist — exactly as
          the parent would. Only then is one claim we own replaced with a value
          read from our own database, and the token re-signed with our own key.
        * **No authorization is weakened.** The backend has never read this claim to
          decide anything; `EnvironmentAwareJWTAuthentication` loads the user row on
          every request and permissions read `user.role` from it. The claim is a
          hint for clients (the edge proxy uses it to route `/` to the dashboard),
          and this keeps that hint honest. A stale *or* forged claim still buys
          nothing but a redirect to a dashboard whose every API call is checked.
        * **Sessions survive.** Nobody is logged out, no refresh token is revoked
          ahead of its time, and rotation plus blacklist-after-rotation are left to
          the parent, jti intact.
        * **Publicly cached pages gain no requests.** The role travels in a token
          the client already refreshes; the alternative — asking `/auth/me` on the
          edge for every visit to `/` — would put a per-visitor API call in front of
          our most-cached page.

        The correction lands within one access-token lifetime (15 minutes), or
        immediately if the client refreshes on demand.
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    RoleRefreshingTokenRefreshRequest:
      type: object
      description: |-
        Refresh, and bring the `role` claim back in step with the database.

        The problem it solves: a doctor applies, is approved, and their account is
        promoted from patient to doctor — but the session they are already holding
