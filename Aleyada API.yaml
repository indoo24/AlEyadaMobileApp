          type: boolean
          description: True if *any* active clinic accepts bookings; otherwise contact-only.
          readOnly: true
        contact:
          type: object
          additionalProperties: {}
          description: |-
            How a patient reaches this doctor: a `tel:` link and a `wa.me` link,
            pre-filled with an opener naming them.

            On the **card**, not only the detail page: the whole point of a directory
            is that a patient can reach a doctor, and making them open a profile first
            adds a step to the one action the product exists for.

