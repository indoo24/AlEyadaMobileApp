      operationId: bookings_list
      description: |-
        Bookings the acting user owns, keyed on PatientProfile ownership.

        Not on `User.role`: a doctor who books an appointment for themselves is, for
        this endpoint, simply a patient. An out-of-scope id 404s — there is nothing
        to enumerate.
      summary: Own appointments
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled_by_clinic
          - cancelled_by_patient
          - completed
          - confirmed
          - expired
          - no_show
          - pending
          - rescheduled
        description: |-
          * `pending` - Pending
          * `confirmed` - Confirmed
          * `cancelled_by_patient` - Cancelled by patient
          * `cancelled_by_clinic` - Cancelled by clinic
          * `completed` - Completed
          * `no_show` - No show
          * `rescheduled` - Rescheduled
          * `expired` - Expired
      tags:
      - booking
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientBookingList'
          description: ''
