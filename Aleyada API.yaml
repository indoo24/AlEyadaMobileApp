components:
  schemas:
    AcceptConsent:
      type: object
      properties:
        policy_version_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - policy_version_ids
    AcceptConsentRequest:
      type: object
      properties:
        policy_version_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - policy_version_ids
    AdminArticle:
      type: object
      description: |-
        Adds who actually wrote it — the moderation queue needs to see the account
        behind an assistant-bylined piece.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title_ar:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-\w]+$
        excerpt:
          type: string
          readOnly: true
          description: Auto-derived from the body if left empty.
        content:
          type: string
          readOnly: true
          description: Rich HTML. Sanitised on save.
        featured_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/ArticleCategory'
          readOnly: true
        reviewed_by_doctor:
          allOf:
          - $ref: '#/components/schemas/Reviewer'
          readOnly: true
