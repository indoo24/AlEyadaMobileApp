        name: q
        schema:
          type: string
        description: Fuzzy name search
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - featured
          - fee_asc
          - nearest
          - newest
          - rating
        description: |-
          Sort order (default: featured)

          * `featured` - Featured first
          * `rating` - Highest rated
          * `newest` - Newest
          * `fee_asc` - Lowest fee
          * `nearest` - Nearest (requires lat/lng)
