            Cheapest consultation fee across the doctor's active clinics.

            Patients compare on price, so the card must show the entry point, not
            an arbitrary clinic's rate.
          readOnly: true
        avg_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
