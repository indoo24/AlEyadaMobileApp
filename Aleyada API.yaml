  /api/v1/doctor/reviews/:
    get:
      operationId: doctor_reviews_list
      description: |-
        A doctor may read their reviews. They may not moderate them — marking
        your own homework is not moderation.

        **Anonymised**: `DoctorReviewSerializer`, never the admin one. The admin
        serializer carries the patient's name and phone, and handing those to the
        doctor would gut the review system's core promise — a patient can rate the
        person who treats them without that person knowing who said it.

        `IsDoctor`, not `IsAuthenticated`: with the latter a patient hitting this got
        a 200 and an empty list. Nothing leaked, but "you may call this and it
        returns nothing" is a different statement from "this is not yours", and the
        first one invites somebody to make the queryset less careful later.
      summary: Reviews of me (read-only, anonymised)
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: rating
        schema:
          type: integer
      tags:
      - doctor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoctorReviewList'
          description: ''
