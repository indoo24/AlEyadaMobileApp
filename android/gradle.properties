org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off.
#
# On Windows it fails this build with "Could not close incremental caches" —
# the .tab files under build/ stay locked between tasks. A full recompile of a
# handful of plugin modules costs seconds; a build that cannot complete costs
# more. Revisit if the Kotlin Gradle plugin fixes the file handling.
kotlin.incremental=false

# The Kotlin compiler runs in the Gradle process rather than its own daemon,
# which is what holds those cache files open here.
kotlin.compiler.execution.strategy=in-process
